{% extends "base/ebase.html" %}
{% load static %}

{% block content %}
<br>
<br>
<div class="form-container">
    <h2>Crear Nuevo Evento</h2>
    <form id="eventoForm">
        {% csrf_token %}
        <input type="hidden" id="csrf_token" value="{{ csrf_token }}">
        <div class="form-group">
            <label for="name">Nombre del Evento:</label>
            <input type="text" id="name" name="name" required>
        </div>
        <div class="form-group">
            <label for="localidad">Localidad:</label>
            <select id="localidad" name="localidad" value="{{ evento.localidad}}" required>
                <option value="1">Medellín</option>
                <option value="2">Bogotá</option>
                <option value="3">Barranquilla</option>
            </select>
        </div>
        <div class="form-group">
            <label for="fecha_inicio">Fecha de Inicio:</label>
            <input type="date" id="fecha_inicio" name="fecha_inicio" required>
        </div>
        <div class="form-group">
            <label for="fecha_fin">Fecha de Fin:</label>
            <input type="date" id="fecha_fin" name="fecha_fin" required>
        </div>
        <button type="button" id="create-event-button" class="submit-btn">Crear Evento</button>
    </form>
    <p id="message"></p> <!-- Mensajes de éxito o error -->
</div>

<div class="table-container">
    <h2>Eventos Recientes</h2>
    <table>
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Inicio</th>
                <th>Fin</th>
                <th>Localidad</th>
            </tr>
        </thead>
        <tbody id="eventosTable">
            <!-- Se llenará dinámicamente con JavaScript -->
        </tbody>
    </table>
</div>
{% endblock %}

{% block script %}
<script>console.log("El script dentro de block script se está ejecutando.");</script>
    <script src="{% static 'js/evento.js' %}"></script>
{% endblock %}
